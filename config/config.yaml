# TurnProof v0.1 configuration. Per-clip overrides under clips.<name>.
models:
  sam: sam-3.1
  spark: muse-spark-1.3
  asr: muse-voice-transcribe-1.0
  spark_reasoning_effort: medium

sampling:
  logic_fps: 2            # occupancy series sampled at this rate (video fps / logic_fps = step)
  aircraft_every_s: 10

# Zone presets. Fractions of the aircraft bounding box: x along the box (0 = left edge),
# y down (0 = top). pad_out extends the zone below the box by that fraction of box height.
zone_presets:
  side:   # camera looks at the fuselage side (clip1, clip3)
    aft_hold:     {x0: 0.62, x1: 0.95, y0: 0.45, y1: 0.95, pad_out: 0.35}
    forward_hold: {x0: 0.08, x1: 0.40, y0: 0.45, y1: 0.95, pad_out: 0.35}
  nose:   # camera looks at the nose; forward hold is low on one side by the engine (clip2)
    forward_hold: {x0: 0.00, x1: 0.45, y0: 0.55, y1: 1.00, pad_out: 0.40}
    aft_hold:     {x0: 0.55, x1: 1.00, y0: 0.55, y1: 1.00, pad_out: 0.40}

zones: &side_zones   # default = side preset
  aft_hold:     {x0: 0.62, x1: 0.95, y0: 0.45, y1: 0.95, pad_out: 0.35}
  forward_hold: {x0: 0.08, x1: 0.40, y0: 0.45, y1: 0.95, pad_out: 0.35}

rules:
  docked_overlap_tau: 0.30
  # Durations in REAL seconds; converted to video seconds with the clip's speed factor and
  # clamped to [floor_video_s, cap_video_s]. Unknown speed factor = treated as real time.
  docked_min_real_s: 60      # equipment must stay at the hold >= 1 min to count as docked
  undocked_min_real_s: 60    # and stay away >= 1 min to count as departed
  merge_gap_real_s: 120      # shorter absences are detection gaps, merged away
  smooth_window_s: 1.0       # rolling median, in VIDEO seconds
  floor_video_s: 2.0
  cap_video_s: 12.0
  spark_confidence_floor: 0.70

integrity:
  hash_alg: sha256
  signature_alg: ed25519
  key_id: turnproof-demo-2026

# Per-clip DECLARED facts. The packet records them as declared, with their source.
# speed_factor: real seconds per video second. null = unknown -> packet is 'unsynced' (no minutes).
# speed_factor_source: 'source_page' (stated by the publisher) or 'estimated' (by the operator).
clips:
  # speed factors below were measured with scripts/estimate_speed.py from vehicle motion in the
  # SAM detections (assumed apron speed 4 m/s); accuracy roughly +/-50%.
  clip1:
    reference_start_utc: "2026-10-30T17:58:00Z"
    speed_factor: 6.0
    speed_factor_source: estimated_from_vehicle_motion
    view: side
    nose: right                 # nose points right in the frame -> hold zones mirrored
  clip2:
    reference_start_utc: "2026-10-30T19:10:00Z"
    speed_factor: 9.0
    speed_factor_source: estimated_from_vehicle_motion
    view: nose
    zones_enabled: [forward_hold]
  clip3:
    reference_start_utc: null   # demonstrates unsynced: no start time declared
    speed_factor: 12.0
    speed_factor_source: estimated_from_vehicle_motion
    view: side
    nose: right
