# TurnProof v0.1 configuration. Per-clip overrides under clips.<name>.
models:
  sam: sam-3.1
  spark: muse-spark-1.3
  asr: muse-voice-transcribe-1.0
  spark_reasoning_effort: medium

sampling:
  logic_fps: 2            # occupancy series sampled at this rate (video fps / logic_fps = step)
  aircraft_every_s: 10

# Zone presets, chosen per clip with `view`. Fractions of the SAM aircraft bounding box
# (x from the left edge, y from the top; pad_out extends below the box by that fraction of its
# height). Zones are named by the hold the camera actually shows; a hold that is hidden from
# that camera angle is simply not defined for that view.
# Zones used by the events below. Only the *_hold zones are validated on our footage; the
# wing_fuel and forward_door zones are DEFINED for the fuelling and catering events but have
# not been checked against real detections yet (no footage with those events).
zone_presets:
  front_quarter:   # camera ahead of the wing, nose toward the jet bridge; the wing sweeps across
                   # the box; the forward hold door sits just ahead of the wing root, low in the box
                   # (clip1, clip3). Checked against the saved SAM boxes of both clips.
    forward_hold: {x0: 0.15, x1: 0.62, y0: 0.50, y1: 0.95, pad_out: 0.20}
    wing_fuel:    {x0: 0.00, x1: 0.30, y0: 0.25, y1: 0.80, pad_out: 0.20}   # not validated
    forward_door: {x0: 0.62, x1: 0.85, y0: 0.35, y1: 0.80, pad_out: 0.10}   # not validated
  side:            # true side-on view, nose at the LEFT of the frame
    forward_hold: {x0: 0.08, x1: 0.40, y0: 0.45, y1: 0.95, pad_out: 0.35}
    aft_hold:     {x0: 0.62, x1: 0.95, y0: 0.45, y1: 0.95, pad_out: 0.35}
    wing_fuel:    {x0: 0.35, x1: 0.70, y0: 0.40, y1: 0.95, pad_out: 0.50}   # not validated
    forward_door: {x0: 0.03, x1: 0.20, y0: 0.25, y1: 0.75, pad_out: 0.00}   # not validated
  nose:            # camera looks at the nose; forward hold low on one side by the engine (clip2)
    forward_hold: {x0: 0.00, x1: 0.45, y0: 0.55, y1: 1.00, pad_out: 0.40}
    wing_fuel:    {x0: 0.00, x1: 0.35, y0: 0.30, y1: 0.80, pad_out: 0.20}   # not validated
    forward_door: {x0: 0.45, x1: 0.80, y0: 0.30, y1: 0.75, pad_out: 0.10}   # not validated

# Event library: one rule engine, several turnaround events. Each event names the SAM concept
# that counts as "equipment", the zones (per view) where it docks, the milestone names it emits,
# and the IATA delay-code families (AHM 730) a claim must belong to for the video to support it.
# `validated` says whether the event has been checked on real footage in this repository.
events:
  loading:
    label: Loading equipment at the hold
    concept: vehicle
    zones: [forward_hold, aft_hold]
    milestones: {start: loader_docked_start, end: loading_complete}
    delay_code_families: ["31", "32", "33", "34", "35", "36", "37", "38", "39"]
    validated: true
  fuelling:
    label: Fuel truck at the wing
    concept: vehicle
    zones: [wing_fuel]
    milestones: {start: fuel_truck_docked_start, end: fuelling_complete}
    delay_code_families: ["36"]
    validated: false
  catering:
    label: Catering truck at the forward door
    concept: vehicle
    zones: [forward_door]
    milestones: {start: catering_docked_start, end: catering_complete}
    delay_code_families: ["37"]
    validated: false

zones:             # default = side preset (overridden per clip by `view`)
  forward_hold: {x0: 0.08, x1: 0.40, y0: 0.45, y1: 0.95, pad_out: 0.35}
  aft_hold:     {x0: 0.62, x1: 0.95, y0: 0.45, y1: 0.95, pad_out: 0.35}

rules:
  docked_overlap_tau: 0.30
  # Durations in REAL seconds; converted to video seconds with the clip's speed factor and
  # clamped to [floor_video_s, cap_video_s]. Unknown speed factor = treated as real time.
  docked_min_real_s: 60      # equipment must stay at the hold >= 1 min to count as docked
  undocked_min_real_s: 60    # and stay away >= 1 min to count as departed
  merge_gap_real_s: 120      # shorter absences are detection gaps, merged away
  smooth_window_s: 1.0       # rolling median, in VIDEO seconds
  floor_video_s: 2.0
  cap_video_s: 12.0
  spark_confidence_floor: 0.70

integrity:
  hash_alg: sha256
  signature_alg: ed25519
  key_id: turnproof-demo-2026

# Per-clip DECLARED facts. The packet records them as declared, with their source.
# speed_factor: real seconds per video second. null = unknown -> packet is 'unsynced' (no minutes).
# speed_factor_source: 'source_page' (stated by the publisher) or 'estimated' (by the operator).
clips:
  # speed factors below were measured with scripts/estimate_speed.py from vehicle motion in the
  # SAM detections (assumed apron speed 4 m/s); accuracy roughly +/-50%.
  # Start times and speed factors are the ones declared for the demo cases (config/demo_cases.json):
  # clip1 = XY123, clip2 = XY789, clip3 = XY456.
  clip1:
    reference_start_utc: "2026-10-30T18:44:45Z"
    speed_factor: 6.0
    speed_factor_source: estimated_from_vehicle_motion
    view: front_quarter
  clip2:
    reference_start_utc: "2026-10-30T18:00:00Z"
    speed_factor: 6.0
    speed_factor_source: estimated_from_vehicle_motion
    view: front_quarter
  clip3:
    reference_start_utc: "2026-10-30T19:56:12Z"
    speed_factor: 12.0
    speed_factor_source: estimated_from_vehicle_motion
    view: front_quarter
